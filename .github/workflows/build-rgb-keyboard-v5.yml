name: Build RGB Keyboard V5 APK

on:
  push:
    branches: [main]
    paths:
      - 'RGBKeyboardAndroid/**'
      - '.github/workflows/build-rgb-keyboard-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V5 source
        uses: actions/checkout@v4

      - name: Verify V5 source is present
        run: |
          if [ ! -f RGBKeyboardAndroid/settings.gradle ] || [ ! -f RGBKeyboardAndroid/app/build.gradle ]; then
            echo "::error::RGBKeyboardAndroid V5 source is missing. Upload/extract the contents of RGB_Keyboard_Android_Project_V5_Build_Workflow.zip into the repository root first."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build V5 debug APK
        working-directory: RGBKeyboardAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload V5 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RGB-Keyboard-Premium-V5-debug-apk
          path: RGBKeyboardAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
