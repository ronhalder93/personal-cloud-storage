name: Diagnose Happy Summer Offline Startup

on:
  push:
    paths:
      - ".github/workflows/analyze-happy-summer-offline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download and verify the pinned APK
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/ronhalder93/personal-cloud-storage/releases/download/happy-summer-android-v1.0/Happy_Summer_-1.0-android.apk"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 5400 "$URL" --output Happy_Summer.apk
          test "$(stat -c%s Happy_Summer.apk)" = "1691853194"
          echo "APK size verified."
          echo "ab4c27b9c79602cf35d89b2585e881d630cca3b80d820ffaacbf4f32df2fb2ee  Happy_Summer.apk" | sha256sum --check

      - name: Install inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y aapt apktool unzip

      - name: Inspect package, archive, and offline references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p report decoded
          {
            echo "# Happy Summer APK static inspection"
            echo
            echo "- APK SHA-256: ab4c27b9c79602cf35d89b2585e881d630cca3b80d820ffaacbf4f32df2fb2ee"
            echo "- APK size: 1,691,853,194 bytes"
            echo "- Static inspection cannot prove offline execution; runtime/device testing is still required."
            echo
            echo "## Package metadata"
            aapt dump badging Happy_Summer.apk
            echo
            echo "## Requested permissions"
            aapt dump permissions Happy_Summer.apk
            echo
            echo "## ZIP/APK integrity"
            unzip -t Happy_Summer.apk | tail -n 3
            echo
            echo "## Entry count"
            unzip -Z -1 Happy_Summer.apk | wc -l
            echo
            echo "## Top-level entries"
            unzip -Z -1 Happy_Summer.apk | awk -F/ 'NF==1 {print}' | head -n 200 || true
            echo
            echo "## Largest archive entries (first 100)"
            zipinfo -l Happy_Summer.apk | head -n 100 || true
            echo
            echo "## Game data, native libraries, and expansion-file entries"
            unzip -l Happy_Summer.apk | grep -Ei 'assets|obb|renpy|game/|\.so|\.rpa|\.rpyc|\.pak|\.bundle|\.zip|\.dat|\.mp3|\.ogg|\.png|\.jpg' | head -n 1500 || true
            echo
            echo "## Downloader/expansion class names"
            unzip -Z -1 Happy_Summer.apk | grep -Ei 'downloader|expansion|obb|googleplay|asset.?pack|main\.[0-9]+\.' | head -n 500 || true
          } > report/summary.txt 2>&1

          # Inspect the game's own bundled debug log and searchable script strings.
          unzip -p Happy_Summer.apk assets/x-debuglog.txt > report/bundled-debuglog.txt 2>/dev/null || true
          if [ -s report/bundled-debuglog.txt ]; then
            {
              echo
              echo "## Bundled game debug log (last 500 lines)"
              tail -n 500 report/bundled-debuglog.txt
              echo
              echo "## Suspicious startup/network/license lines from bundled debug log"
              grep -Ein 'error|exception|traceback|failed|crash|download|license|network|internet|connection|asset|permission|unsupported|vulkan|opengl|egl|sdl|python' report/bundled-debuglog.txt | tail -n 500 || true
            } >> report/summary.txt
          else
            echo "No readable assets/x-debuglog.txt found in APK." >> report/summary.txt
          fi
          unzip -Z -1 Happy_Summer.apk | grep -E '^assets/x-game/.*\\.rpyc
          if [ -f decoded/AndroidManifest.xml ]; then
            cp decoded/AndroidManifest.xml report/AndroidManifest.xml
            {
              echo
              echo "## Manifest flags and network configuration references"
              grep -Ein 'usesCleartextTraffic|networkSecurityConfig|INTERNET|ACCESS_NETWORK_STATE|uses-sdk|extractNativeLibs|isGame|android:debuggable|android:allowBackup' decoded/AndroidManifest.xml || true
              echo
              echo "## URLs/domains embedded in decoded resources and smali"
              grep -RhoE 'https?://[^"[:space:]<>]+' decoded/res decoded/smali* 2>/dev/null | sed 's/[),;].*$//' | sort -u | head -n 500 || true
              echo
              echo "## Offline/cache/download/network/expansion references"
              grep -RinE 'offline|no.?network|internet|connectivity|download|streaming|asset.?bundle|remote.?config|login|server|api\.|obb|expansion|APKExpansion|DownloaderService|DownloaderClient|LVL|licens|main\.[0-9]+\.|patch\.' decoded/res decoded/smali* 2>/dev/null | head -n 2500 || true
            } >> report/summary.txt
          fi
          cp report/apktool.log report/ 2>/dev/null || true
          cat report/summary.txt

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: happy-summer-offline-diagnostic
          path: report/
          if-no-files-found: error
          retention-days: 14
 | head -n 1000 > report/compiled-game-script-list.txt || true

          apktool d -f -s Happy_Summer.apk -o decoded > report/apktool.log 2>&1 || echo "apktool could not fully decode; see apktool.log." >> report/summary.txt

          if [ -f decoded/AndroidManifest.xml ]; then
            cp decoded/AndroidManifest.xml report/AndroidManifest.xml
            {
              echo
              echo "## Manifest flags and network configuration references"
              grep -Ein 'usesCleartextTraffic|networkSecurityConfig|INTERNET|ACCESS_NETWORK_STATE|uses-sdk|extractNativeLibs|isGame|android:debuggable|android:allowBackup' decoded/AndroidManifest.xml || true
              echo
              echo "## URLs/domains embedded in decoded resources and smali"
              grep -RhoE 'https?://[^"[:space:]<>]+' decoded/res decoded/smali* 2>/dev/null | sed 's/[),;].*$//' | sort -u | head -n 500 || true
              echo
              echo "## Offline/cache/download/network/expansion references"
              grep -RinE 'offline|no.?network|internet|connectivity|download|streaming|asset.?bundle|remote.?config|login|server|api\.|obb|expansion|APKExpansion|DownloaderService|DownloaderClient|LVL|licens|main\.[0-9]+\.|patch\.' decoded/res decoded/smali* 2>/dev/null | head -n 2500 || true
            } >> report/summary.txt
          fi
          cp report/apktool.log report/ 2>/dev/null || true
          cat report/summary.txt

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: happy-summer-offline-diagnostic
          path: report/
          if-no-files-found: error
          retention-days: 14
