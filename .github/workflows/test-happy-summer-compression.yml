name: Package Happy Summer APK for Phone Download
on:
  push:
    paths:
      - ".github/workflows/test-happy-summer-compression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download verified APK
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/ronhalder93/personal-cloud-storage/releases/download/happy-summer-android-v1.0/Happy_Summer_-1.0-android.apk"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 5400 "$URL" --output Happy_Summer.apk
          test "$(stat -c%s Happy_Summer.apk)" = "1691853194"
          echo "ab4c27b9c79602cf35d89b2585e881d630cca3b80d820ffaacbf4f32df2fb2ee  Happy_Summer.apk" | sha256sum --check
      - name: Upload APK directly as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: happy-summer-apk-for-phone
          path: Happy_Summer.apk
          if-no-files-found: error
          retention-days: 7
